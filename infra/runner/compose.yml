# Runner stack on CT 105: /home/tagaroa/runner. `.env` there holds RUNNER_UID,
# DOCKER_GID and, for the first start only, RUNNER_TOKEN.
name: tagaroa-runner
services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_UID: ${RUNNER_UID:?required}
        DOCKER_GID: ${DOCKER_GID:?required}
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/tagaroa/apps:/home/tagaroa/apps
      - config:/config
      - work:/home/runner/_work
volumes:
  config: {}
  work: {}
