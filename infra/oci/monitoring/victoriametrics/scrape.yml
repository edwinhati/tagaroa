global:
  scrape_interval: 30s
scrape_configs:
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: postgres_pangolin_tables
    static_configs:
      - targets:
          - postgres-pangolin-exporter:9187
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: pgbouncer
    static_configs:
      - targets:
          - pgbouncer-exporter:9127
  - job_name: valkey
    static_configs:
      - targets:
          - valkey-exporter:9121
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://grafana:3000/api/health
        labels:
          service: grafana
      - targets:
          - http://victoriametrics:8428/health
        labels:
          service: victoriametrics
      - targets:
          - http://victorialogs:9428/health
        labels:
          service: victorialogs
      - targets:
          - http://postgres-exporter:9187/metrics
        labels:
          service: postgres-exporter
      - targets:
          - http://netbird-server/oauth2/.well-known/openid-configuration
        labels:
          service: netbird
      - targets:
          - http://arcane:3552/api/health
        labels:
          service: arcane
      - targets:
          - https://transport.service.tagaroa.cc/
        labels:
          service: tms-web
      - targets:
          - https://transport.service.tagaroa.cc/api/health
        labels:
          service: tms-api
      - targets:
          - https://gps.service.tagaroa.cc/api/server
        labels:
          service: tms-traccar
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - postgres:5432
        labels:
          service: postgres
      - targets:
          - pgbouncer:6432
        labels:
          service: pgbouncer
      - targets:
          - valkey:6379
        labels:
          service: valkey
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - service
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: victoriatraces
    static_configs:
      - targets:
          - victoriatraces:10428
  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428
  - job_name: victorialogs
    static_configs:
      - targets:
          - victorialogs:9428
  - job_name: vmalert
    static_configs:
      - targets:
          - vmalert:8880
  - job_name: vector
    static_configs:
      - targets:
          - vector:9598
  - job_name: netbird
    static_configs:
      - targets:
          - netbird-server:9090
