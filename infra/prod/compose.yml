name: tagaroa-prod
x-core: &core
  image: ${CORE_IMAGE:?required}
  env_file: .env
  networks: [postgres, egress, app]
services:
  migrate:
    <<: *core
    command: [bun, dist/migrate.js]
  preflight:
    <<: *core
    command: [bun, scripts/security-preflight.ts]
  core:
    <<: *core
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:?required}
    restart: unless-stopped
    environment:
      BASE_DOMAIN: tagaroa.cc
    networks: [app, pangolin]
    depends_on:
      core: { condition: service_healthy }
networks:
  app:
    internal: true
  postgres:
    external: true
    name: postgres_backend
  egress:
    external: true
    name: oci_egress
  pangolin:
    external: true
    name: pangolin_default
