# Prod stack on the OCI VM, copied to /home/tagaroa/apps by every release.
# `.env` stays on the box; `.release.env` (the sha and image refs) is written by deploy.sh.
# Pangolin reaches core and each app on pangolin_default.
name: tagaroa-prod
x-core: &core
  image: ${CORE_IMAGE:?required}
  env_file: .env
  networks: [postgres, egress, pangolin]
x-app: &app
  restart: unless-stopped
  environment:
    BASE_DOMAIN: tagaroa.cc
  networks: [pangolin]
services:
  migrate:
    <<: *core
    command: [bun, dist/migrate.js]
  preflight:
    <<: *core
    command: [bun, scripts/security-preflight.ts]
  core:
    <<: *core
    restart: unless-stopped
  auth:
    <<: *app
    image: ${AUTH_IMAGE:?required}
  admin:
    <<: *app
    image: ${ADMIN_IMAGE:?required}
  workspace:
    <<: *app
    image: ${WORKSPACE_IMAGE:?required}
  engineering:
    <<: *app
    image: ${ENGINEERING_IMAGE:?required}
networks:
  postgres:
    external: true
    name: postgres_backend
  egress:
    external: true
    name: oci_egress
  pangolin:
    external: true
    name: pangolin_default
