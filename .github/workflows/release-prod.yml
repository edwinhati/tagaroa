name: Release prod

# Releases the approved release brief to prod. Started only by
# infra/release/approve.sh, which approves the brief and dispatches this run.
# The runner joins NetBird for the job to reach Artifact Keeper and Multica.
# Spec: docs/ops/workflows/release-prod.md
on:
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: >-
          bash infra/ci/netbird-up.sh
          172.25.251.19=registry.engineering.tagaroa.cc
          172.25.251.12=multica.engineering.tagaroa.cc

      - name: Install the Multica CLI
        run: bash infra/ci/install-multica.sh

      - name: Release approved brief
        shell: bash
        env:
          MULTICA_SERVER_URL: https://multica.engineering.tagaroa.cc
          MULTICA_WORKSPACE_ID: 146a9d46-1689-41e0-a8f4-20c8468b372f
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}
          OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp infra/release/release.sh "$RUNNER_TEMP/tagaroa-release.sh"
          bash "$RUNNER_TEMP/tagaroa-release.sh"
