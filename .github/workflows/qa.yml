name: QA

# Every pull request runs, docs-only ones included, so the checks the main ruleset
# requires always report. A docs-only push to main skips: it would deploy nothing.
# A newer push cancels the running one.
# Pull requests run only the slow suites their change can affect (scripts/ci/qa-scope.sh);
# main, the schedule and manual runs always run all of them.
# The repository variable QA_RUNS_ON moves both jobs onto the sandboxed self-hosted
# runner, e.g. ["self-hosted","tagaroa-qa"] (docs/ops/workflows/qa-runner.md).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 0" # Sundays 01:00 UTC (08:00 Asia/Jakarta).

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.QA_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      # Two commits: a pull request's merge commit and its base, for check:changesets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: bun
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # A change to what core or an app is built from needs a changeset naming it, or it
      # never gets a new version or image. Dependabot's bumps ride with the next one.
      - run: bun run check:changesets HEAD^1
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      # This archive transports Turbo entries; Turbo still validates each task hash.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: turbo-cache
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-
      - run: bun run lint
      - run: bun run format
      - run: bun run check-types
      - run: bun run boundaries
      - run: bun run test
      - run: bun run build
      # Pinned by checksum; Dependabot does not see this one, so bump it by hand.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # GitHub's and the QA runner's images ship shellcheck; local-ci's actions-runner image does not.
      - run: command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
      - run: bun run check:infra
      # Forks and other contributors can read public artifacts, but cannot publish them.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login == github.repository_owner)
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  # Applied migrations are immutable: drizzle's migrator never re-checks their hash.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: sh scripts/check-migrations.sh origin/${{ github.base_ref }}
      - run: node --test scripts/check-migrations.test.mjs

  workflows:
    runs-on: ${{ fromJSON(vars.QA_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Pushes to main repeat a pull request that already ran every browser, so they run
      # chromium alone: a flaky browser there would open a Rex issue on every merge.
      matrix:
        project: ${{ fromJSON(github.event_name == 'push' && '["chromium"]' || '["chromium","firefox","webkit","mobile-chromium"]') }}
    steps:
      # Two commits: a pull request's merge commit and its base, for qa-scope.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: bash scripts/ci/qa-scope.sh "$BASE"
      # The self-hosted image already carries the browsers' system libraries.
      - run: bunx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
        if: steps.scope.outputs.e2e_auth == 'true' || steps.scope.outputs.e2e_admin == 'true'
        working-directory: apps/auth
      - run: bun run test:integration --log-order=stream
        if: matrix.project == 'chromium' && steps.scope.outputs.integration == 'true'
      # Both browser suites share the seeded operator and must run sequentially.
      - run: bun run test:e2e --project ${{ matrix.project }}
        if: steps.scope.outputs.e2e_auth == 'true'
        working-directory: apps/auth
      - run: bun run test:e2e --project ${{ matrix.project }}
        if: steps.scope.outputs.e2e_admin == 'true'
        working-directory: apps/admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            apps/auth/test-results
            apps/admin/test-results
          retention-days: 7
