name: QA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test
      - run: bun run build

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","webkit","mobile-chromium"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
        working-directory: apps/auth
      - run: bun run test:integration
      # Both browser suites share the seeded operator and must run sequentially.
      - run: bun run test:e2e --project ${{ matrix.project }}
        working-directory: apps/auth
      - run: bun run test:e2e --project ${{ matrix.project }}
        working-directory: apps/admin
      - run: bunx e2e-web install chromium --with-deps
        if: matrix.project == 'chromium'
      - run: bun run test:exploration
        if: matrix.project == 'chromium'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            apps/auth/test-results
            apps/admin/test-results
            .e2e
          retention-days: 7
