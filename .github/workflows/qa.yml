name: QA

# Free-plan minutes: docs-only changes skip CI, a newer push cancels the
# running one, and the three-browser matrix runs manually and weekly on Sundays.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 0" # Sundays 01:00 UTC (08:00 Asia/Jakarta).

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # This archive transports Turbo entries; Turbo still validates each task hash.
      - uses: actions/cache/restore@v6
        id: turbo-cache
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test
      - run: bun run build
      # Forks and other contributors can read public artifacts, but cannot publish them.
      - uses: actions/cache/save@v6
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login == github.repository_owner)
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["chromium","webkit","mobile-chromium"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}
        working-directory: apps/auth
      - run: bun run test:integration
      # Both browser suites share the seeded operator and must run sequentially.
      - run: bun run test:e2e --project ${{ matrix.project }}
        working-directory: apps/auth
      - run: bun run test:e2e --project ${{ matrix.project }}
        working-directory: apps/admin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            apps/auth/test-results
            apps/admin/test-results
          retention-days: 7

  # Opens a "QA failed on main" issue for Rex in Multica. Skipped for PRs, which their author fixes.
  # The key is the run id alone: a rerun of the same run must not open another issue (a rerun
  # chain opened nine, and each woke an agent that reran it again).
  notify-multica:
    needs: [checks, workflows]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          WEBHOOK: ${{ secrets.MULTICA_QA_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: qa-${{ github.run_id }}" \
            -d "{\"event\":\"${{ github.event_name }}\",\"sha\":\"${{ github.sha }}\",\"run_url\":\"$RUN_URL\"}"
