name: Deploy dev

# Every main commit that passes QA is running on dev a few minutes later. Docs-only
# pushes skip QA, so they never deploy. One image per deployable, versioned by
# changesets, is built on GitHub-hosted runners, which join NetBird for the job to
# push to Artifact Keeper; dev is the DigitalOcean droplet.
# Spec: docs/ops/workflows/deploy-dev.md
on:
  workflow_run:
    workflows: [QA]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default - current main)
        required: false

# GitHub keeps only the newest pending run, so a burst of merges deploys the last one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: registry.engineering.tagaroa.cc
  # Private ingress addresses, reachable only over NetBird; netbird-up.sh pins them.
  REGISTRY_ADDRESS: 172.25.251.19=registry.engineering.tagaroa.cc
  MULTICA_ADDRESS: 172.25.251.12=multica.engineering.tagaroa.cc
  DEV_HOST: tagaroa@168.144.104.237
  APPS_DIR: /home/tagaroa/apps
  MULTICA_SERVER_URL: https://multica.engineering.tagaroa.cc
  MULTICA_WORKSPACE_ID: 146a9d46-1689-41e0-a8f4-20c8468b372f

jobs:
  sha:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Never the branch tip: a later merge must not slip into this deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve sha
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Use a full commit SHA."; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "${RUN_SHA:-${INPUT_SHA:-origin/main}}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to deploy it."
            exit 1
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" \
            | jq -e '.workflow_runs | length > 0' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Each deployable's version comes from changesets, and its image tag from its
  # version (infra/ci/plan-images.sh): a pending changeset makes it X.Y.Z-alpha-<sha7>,
  # none leaves it at its released X.Y.Z. Only tags the registry lacks are built, so a
  # released version is built once, from the commit that set it, and release.sh copies
  # that image to prod by digest.
  plan:
    needs: sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      core: ${{ steps.plan.outputs.core }}
      apps: ${{ steps.plan.outputs.apps }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Plan images
        id: plan
        env:
          SHA: ${{ needs.sha.outputs.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin
          bash infra/ci/plan-images.sh

  # Core has native dependencies, so each platform is built on its own runner (dev runs
  # amd64, prod arm64); deploy joins the two single-platform pushes with `docker manifest`.
  build-core:
    needs: [sha, plan]
    if: needs.plan.outputs.core != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Build and push core
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.core }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false --push \
            -f servers/core/Dockerfile -t "$REGISTRY/tagaroa/core:$VERSION-$ARCH" .

  # One image per front end, for both platforms. Only the build stage runs code, on
  # this runner's platform, so the arm64 image needs no emulation; the second build
  # reuses the first one's stages.
  build-apps:
    needs: [sha, plan]
    if: needs.plan.outputs.apps != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Build and push ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
          DIR: ${{ matrix.dir }}
          APP_PATH: ${{ matrix.path }}
          VERSION: ${{ matrix.version }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin
          image="$REGISTRY/tagaroa/$NAME:$VERSION"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --provenance=false --sbom=false --push \
              -f infra/web/Dockerfile --build-arg "APP=$DIR" --build-arg "APP_PATH=$APP_PATH" \
              -t "$image-$arch" .
          done
          docker manifest create "$image" "$image-amd64" "$image-arm64"
          docker manifest push --purge "$image"

  deploy:
    needs: [sha, plan, build-core, build-apps]
    # A build with nothing to build is skipped, which must not skip the deploy.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.build-core.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build-apps.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Join core's platforms
        if: needs.plan.outputs.core != ''
        env:
          VERSION: ${{ needs.plan.outputs.core }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin
          core="$REGISTRY/tagaroa/core:$VERSION"
          docker manifest create "$core" "$core-amd64" "$core-arm64"
          docker manifest push --purge "$core"

      # The droplet pulls from the registry over its own NetBird link.
      - name: Deploy
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf '%s\n' "$RELEASE"
          scp infra/dev/compose.yml infra/dev/deploy.sh infra/dev/onboard.sh infra/dev/smoke.sh "$DEV_HOST:$APPS_DIR/"
          # APPS_DIR is a fixed path; the release travels on stdin.
          # shellcheck disable=SC2029
          ssh "$DEV_HOST" "sh $APPS_DIR/deploy.sh" <<< "$RELEASE"

      - name: Smoke check
        run: |
          # shellcheck disable=SC2029
          ssh "$DEV_HOST" "sh $APPS_DIR/smoke.sh"

  # Its own job, so a stale brief is reported as that and not as a broken dev, which
  # by now is deployed and passed its smoke check. A failed sha never gets here.
  # The run is done when the brief is current.
  brief:
    needs: [sha, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$MULTICA_ADDRESS"

      - name: Install the Multica CLI
        run: bash infra/ci/install-multica.sh

      - name: Update release brief
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          SHA: ${{ needs.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_URL: ${{ github.event.workflow_run.html_url }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: tagaroa@168.107.65.35
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Multica reporting is optional: a failure warns, it does not fail the run.
          bash infra/release/brief-step.sh
