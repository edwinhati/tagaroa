name: Deploy dev

# Every main commit that passes QA is running on dev a few minutes later. Docs-only
# pushes skip QA, so they never deploy. Runs only on the self-hosted runner, which
# refuses anything but trusted events on main (infra/runner/hooks/job-started.sh).
# Spec: docs/ops/workflows/deploy-dev.md
on:
  workflow_run:
    workflows: [QA]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default - current main)
        required: false

# GitHub keeps only the newest pending run, so a burst of merges deploys the last one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: 10.10.10.14:8080
  APPS_DIR: /home/tagaroa/apps
  DEV_URL: http://10.10.10.5:22830
  # CT 105 reaches Multica over the LAN; the public proxy drops runner auth.
  MULTICA_SERVER_URL: http://10.10.10.7:8080
  MULTICA_WORKSPACE_ID: 146a9d46-1689-41e0-a8f4-20c8468b372f

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, tagaroa]
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Never the branch tip: a later merge must not slip into this deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      # CT 105's disk is shared with other projects. On 2026-11-12 a build filled
      # it, and the runner container died and could not restart (ISSUE-113).
      - name: Check free disk
        run: |
          free_gb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "CT 105 has ${free_gb} GB free."
          if [ "$free_gb" -lt 8 ]; then
            echo "::error::Only ${free_gb} GB free on CT 105; a dev build needs about 8 GB. Free space there, then rerun."
            exit 1
          fi

      - name: Resolve sha
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Use a full commit SHA."; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "${RUN_SHA:-${INPUT_SHA:-origin/main}}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to deploy it."
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" \
            | jq -e '.workflow_runs | length > 0' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Everything prod will run is built here, once, and release.sh copies it by
      # digest instead of rebuilding: core for both platforms (dev runs amd64, prod
      # arm64) and prod's web image, which bakes in prod's URLs, for arm64. The build
      # stages run natively and the runtime stages only copy, so arm64 costs little.
      # Single-platform pushes without attestations, joined by `docker manifest`,
      # work with the default buildx driver and Zot's plain HTTP.
      - name: Build and push images
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          core="$REGISTRY/tagaroa/core:$SHA"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --provenance=false --sbom=false --push \
              -f servers/core/Dockerfile -t "$core-$arch" .
          done
          docker manifest rm "$core" 2>/dev/null || true
          docker manifest create --insecure "$core" "$core-amd64" "$core-arm64"
          docker manifest push --insecure --purge "$core"
          docker buildx build --platform linux/amd64 --push \
            -f infra/web/Dockerfile -t "$REGISTRY/tagaroa/web-dev:$SHA" \
            --build-arg VITE_AUTH_BASE_URL=https://dev.tagaroa.cc \
            --build-arg VITE_AUTH_URL=https://auth.dev.tagaroa.cc \
            --build-arg VITE_WORKSPACE_URL=https://app.dev.tagaroa.cc \
            --build-arg VITE_ADMIN_URL=https://admin.dev.tagaroa.cc \
            --build-arg VITE_POST_SIGNIN_URL=https://app.dev.tagaroa.cc \
            --build-arg VITE_TRUSTED_REDIRECT_ORIGINS=https://app.dev.tagaroa.cc,https://admin.dev.tagaroa.cc .
          docker buildx build --platform linux/arm64 --push \
            -f infra/web/Dockerfile -t "$REGISTRY/tagaroa/web-prod:$SHA" \
            --build-arg VITE_AUTH_BASE_URL=https://tagaroa.cc \
            --build-arg VITE_AUTH_URL=https://auth.tagaroa.cc \
            --build-arg VITE_WORKSPACE_URL=https://app.tagaroa.cc \
            --build-arg VITE_ADMIN_URL=https://admin.tagaroa.cc \
            --build-arg VITE_POST_SIGNIN_URL=https://app.tagaroa.cc \
            --build-arg VITE_TRUSTED_REDIRECT_ORIGINS=https://app.tagaroa.cc,https://admin.tagaroa.cc .

      # The runner mounts $APPS_DIR at the same path, so this is CT 105's own directory.
      - name: Deploy
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cp infra/dev/compose.yml infra/dev/deploy.sh infra/dev/onboard.sh "$APPS_DIR/"
          sh "$APPS_DIR/deploy.sh" "$REGISTRY/tagaroa/core:$SHA" "$REGISTRY/tagaroa/web-dev:$SHA"

      - name: Smoke check
        run: |
          check() { # host path expected-content-type-prefix
            for _ in $(seq 1 15); do
              out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -H "Host: $1" "$DEV_URL$2" || true)
              case "$out" in "200 $3"*) echo "ok   $1$2 -> $out"; return 0 ;; esac
              sleep 2
            done
            echo "FAIL $1$2 -> $out"; return 1
          }
          check dev.tagaroa.cc /api/health/live application/json
          check app.dev.tagaroa.cc / text/html
          check auth.dev.tagaroa.cc / text/html
          check admin.dev.tagaroa.cc / text/html
          check app.dev.tagaroa.cc /engineering text/html

  # Its own job, so a stale brief is reported as that and not as a broken dev, which
  # by now is deployed and passed its smoke check. A failed sha never gets here.
  # The run is done when the brief is current.
  brief:
    needs: deploy
    runs-on: [self-hosted, tagaroa]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Update release brief
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          SHA: ${{ needs.deploy.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_URL: ${{ github.event.workflow_run.html_url }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: tagaroa@168.107.65.35
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Multica reporting is optional: a failure warns, it does not fail the run.
          bash infra/release/brief-step.sh

      - name: Forget Multica login
        if: always()
        run: |
          multica auth logout || true
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
