name: Deploy dev

# Every main commit that passes QA is running on dev a few minutes later. Docs-only
# pushes skip QA, so they never deploy. Images are built on GitHub-hosted runners,
# which join NetBird for the job to push to Artifact Keeper; dev is the DigitalOcean
# droplet. Spec: docs/ops/workflows/deploy-dev.md
on:
  workflow_run:
    workflows: [QA]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default - current main)
        required: false

# GitHub keeps only the newest pending run, so a burst of merges deploys the last one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: registry.engineering.tagaroa.cc
  # Private ingress addresses, reachable only over NetBird; netbird-up.sh pins them.
  REGISTRY_ADDRESS: 172.25.251.19=registry.engineering.tagaroa.cc
  MULTICA_ADDRESS: 172.25.251.12=multica.engineering.tagaroa.cc
  DEV_HOST: tagaroa@168.144.104.237
  APPS_DIR: /home/tagaroa/apps
  MULTICA_SERVER_URL: https://multica.engineering.tagaroa.cc
  MULTICA_WORKSPACE_ID: 146a9d46-1689-41e0-a8f4-20c8468b372f

jobs:
  sha:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Never the branch tip: a later merge must not slip into this deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve sha
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Use a full commit SHA."; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "${RUN_SHA:-${INPUT_SHA:-origin/main}}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to deploy it."
            exit 1
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" \
            | jq -e '.workflow_runs | length > 0' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Everything prod will run is built here, once, and release.sh copies it by digest
  # instead of rebuilding: core for both platforms (dev runs amd64, prod arm64) and
  # prod's web image, which bakes in prod's URLs. Each runner builds its own platform
  # natively. Single-platform pushes without attestations are joined by `docker manifest`.
  build:
    needs: sha
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            web: web-dev
            domain: dev.tagaroa.cc
          - arch: arm64
            runner: ubuntu-24.04-arm
            web: web-prod
            domain: tagaroa.cc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin

      - name: Build and push images
        env:
          SHA: ${{ needs.sha.outputs.sha }}
          ARCH: ${{ matrix.arch }}
          WEB: ${{ matrix.web }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false --sbom=false --push \
            -f servers/core/Dockerfile -t "$REGISTRY/tagaroa/core:$SHA-$ARCH" .
          docker buildx build --platform "linux/$ARCH" --push \
            -f infra/web/Dockerfile -t "$REGISTRY/tagaroa/$WEB:$SHA" \
            --build-arg "VITE_AUTH_BASE_URL=https://$DOMAIN" \
            --build-arg "VITE_AUTH_URL=https://auth.$DOMAIN" \
            --build-arg "VITE_WORKSPACE_URL=https://app.$DOMAIN" \
            --build-arg "VITE_ADMIN_URL=https://admin.$DOMAIN" \
            --build-arg "VITE_POST_SIGNIN_URL=https://app.$DOMAIN" \
            --build-arg "VITE_TRUSTED_REDIRECT_ORIGINS=https://app.$DOMAIN,https://admin.$DOMAIN" .

  deploy:
    needs: [sha, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$REGISTRY_ADDRESS"

      - name: Join core's platforms
        env:
          SHA: ${{ needs.sha.outputs.sha }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username ci --password-stdin
          core="$REGISTRY/tagaroa/core:$SHA"
          docker manifest create "$core" "$core-amd64" "$core-arm64"
          docker manifest push --purge "$core"

      # The droplet pulls from the registry over its own NetBird link.
      - name: Deploy
        env:
          SHA: ${{ needs.sha.outputs.sha }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          scp infra/dev/compose.yml infra/dev/deploy.sh infra/dev/onboard.sh infra/dev/smoke.sh "$DEV_HOST:$APPS_DIR/"
          # The refs hold only the fixed registry and a hex sha.
          # shellcheck disable=SC2029
          ssh "$DEV_HOST" "sh $APPS_DIR/deploy.sh '$REGISTRY/tagaroa/core:$SHA' '$REGISTRY/tagaroa/web-dev:$SHA'"

      - name: Smoke check
        run: |
          # shellcheck disable=SC2029
          ssh "$DEV_HOST" "sh $APPS_DIR/smoke.sh"

  # Its own job, so a stale brief is reported as that and not as a broken dev, which
  # by now is deployed and passed its smoke check. A failed sha never gets here.
  # The run is done when the brief is current.
  brief:
    needs: [sha, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sha.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: bash infra/ci/netbird-up.sh "$MULTICA_ADDRESS"

      - name: Install the Multica CLI
        run: bash infra/ci/install-multica.sh

      - name: Update release brief
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          SHA: ${{ needs.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_URL: ${{ github.event.workflow_run.html_url }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: tagaroa@168.107.65.35
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Multica reporting is optional: a failure warns, it does not fail the run.
          bash infra/release/brief-step.sh
