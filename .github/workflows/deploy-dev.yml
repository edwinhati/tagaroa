name: Deploy dev

# Every main commit that passes QA is running on dev a few minutes later. Docs-only
# pushes skip QA, so they never deploy. Runs only on the self-hosted runner, which
# refuses anything but trusted events on main (infra/runner/hooks/job-started.sh).
# Spec: docs/ops/workflows/deploy-dev.md
on:
  workflow_run:
    workflows: [QA]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default - current main)
        required: false

# GitHub keeps only the newest pending run, so a burst of merges deploys the last one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: 10.10.10.14:8080
  APPS_DIR: /home/tagaroa/apps
  DEV_URL: http://10.10.10.5:22830
  MULTICA_SERVER_URL: https://multica.engineering.tagaroa.cc
  MULTICA_WORKSPACE_ID: 146a9d46-1689-41e0-a8f4-20c8468b372f

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, tagaroa]
    timeout-minutes: 45
    steps:
      # Never the branch tip: a later merge must not slip into this deploy.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve sha
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export LOG="$RUNNER_TEMP/deploy.log"
          echo "LOG=$LOG" >> "$GITHUB_ENV"
          : > "$LOG"
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Use a full commit SHA."; exit 1; }
          sha=$(git rev-parse --verify --end-of-options "${RUN_SHA:-${INPUT_SHA:-origin/main}}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to deploy it."
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          curl -fsS --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/qa.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" \
            | jq -e '.workflow_runs | length > 0' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        id: build
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          {
            docker buildx build --platform linux/amd64 --push \
              -f servers/core/Dockerfile -t "$REGISTRY/tagaroa/core:$SHA" .
            docker buildx build --platform linux/amd64 --push \
              -f infra/web/Dockerfile -t "$REGISTRY/tagaroa/web-dev:$SHA" \
              --build-arg VITE_AUTH_BASE_URL=https://dev.tagaroa.cc \
              --build-arg VITE_AUTH_URL=https://auth.dev.tagaroa.cc \
              --build-arg VITE_WORKSPACE_URL=https://app.dev.tagaroa.cc \
              --build-arg VITE_ADMIN_URL=https://admin.dev.tagaroa.cc \
              --build-arg VITE_POST_SIGNIN_URL=https://app.dev.tagaroa.cc \
              --build-arg VITE_TRUSTED_REDIRECT_ORIGINS=https://app.dev.tagaroa.cc,https://admin.dev.tagaroa.cc .
          } 2>&1 | tee -a "$LOG"

      # The runner mounts $APPS_DIR at the same path, so this is CT 105's own directory.
      - name: Deploy
        id: deploy
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cp infra/dev/compose.yml infra/dev/deploy.sh "$APPS_DIR/"
          sh "$APPS_DIR/deploy.sh" "$REGISTRY/tagaroa/core:$SHA" "$REGISTRY/tagaroa/web-dev:$SHA" 2>&1 | tee -a "$LOG"

      - name: Smoke check
        id: smoke
        run: |
          check() { # host path expected-content-type-prefix
            for _ in $(seq 1 15); do
              out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -H "Host: $1" "$DEV_URL$2" || true)
              case "$out" in "200 $3"*) echo "ok   $1$2 -> $out"; return 0 ;; esac
              sleep 2
            done
            echo "FAIL $1$2 -> $out"; return 1
          }
          {
            check dev.tagaroa.cc /api/health/live application/json
            check app.dev.tagaroa.cc / text/html
            check auth.dev.tagaroa.cc / text/html
            check admin.dev.tagaroa.cc / text/html
            check app.dev.tagaroa.cc /engineering text/html
          } 2>&1 | tee -a "$LOG"

      # The run is done when the brief is current. A failed sha never gets here.
      - name: Update release brief
        id: brief
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_URL: ${{ github.event.workflow_run.html_url }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: tagaroa@168.107.65.35
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          multica login --token "$MULTICA_TOKEN" >/dev/null
          bash infra/release/brief.sh "$SHA" 2>&1 | tee -a "$LOG"

      - name: Forget Multica login
        if: always()
        run: |
          multica auth logout || true
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Alert Rex
        if: failure() && steps.sha.outcome != 'failure'
        env:
          MULTICA_OPS_WEBHOOK: ${{ secrets.MULTICA_OPS_WEBHOOK }}
          STEPS: ${{ toJSON(steps) }}
          SHA: ${{ steps.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$MULTICA_OPS_WEBHOOK" ]; then echo "::warning::MULTICA_OPS_WEBHOOK is not set; nobody was alerted."; exit 0; fi
          step=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<<"$STEPS" | head -1)
          sh infra/ops/ops-alert.sh --kind dev-deploy-failed \
            --id "${{ github.run_id }}-${{ github.run_attempt }}" --env dev \
            --sha "$SHA" --step "$step" --run-url "$RUN_URL" --log "$LOG"
